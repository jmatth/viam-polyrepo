[viam]
image=ghcr.io/ublue-os/fedora-toolbox:latest
pull=true

# VSCodium repo
pre_init_hooks="base64 -d > /etc/yum.repos.d/vscodium.repo <<< ''"

# additional_packages doesn't support package groups
init_hooks="dnf group install -y c-development"

# rdk cgo deps
additional_packages="x264-devel NLopt-devel"

# extra cli tools
additional_packages="picocom"
exported_bins="/usr/bin/picocom"

# extra gui apps
additional_packages="codium"
exported_apps="codium"
